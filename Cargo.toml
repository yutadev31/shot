[package]
name = "shot"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
image = "0.25.10"
memmap2 = "0.9.12"
tempfile = "3.27.0"
thiserror = "2.0.21"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["image", "randr"] }
